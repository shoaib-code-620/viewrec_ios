name: viewrec
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  animations: ^3.0.0
  camera: ^0.12.2
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  http: ^1.6.0
  http_parser: ^4.1.2
  file_picker: ^13.4.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  record: ^7.2.0
  pro_image_editor: ^14.29.0
  pro_video_editor: ^2.54.0
  material_ui: ^1.1.0
  shared_preferences: ^2.5.6
  emoji_picker_flutter: ^4.3.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B5FC4"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F5F9FF"
  color_dark: "#06101F"
  image: "assets/icon/splash_logo.png"
  android_12:
    color: "#F5F9FF"
    color_dark: "#06101F"
    image: "assets/icon/splash_logo.png"
